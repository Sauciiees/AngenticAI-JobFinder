version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: jobfinder_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: jobfinder_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      # Tell Streamlit to talk to the backend container over the internal network
      - BACKEND_URL=http://backend:8000
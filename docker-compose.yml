version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    container_name: jobfinder_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./vector_db:/app/vector_db
    env_file:
      - .env
    # The web frontend (frontend/) is served by this same container at http://localhost:8000